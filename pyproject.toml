[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "respiratory-viral-multiplex-engine"
version = "2.0.1"
description = "Respiratory multiplex analysis demonstration and research utilities"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
requires-python = ">=3.10"
dependencies = ["pydantic>=2.6,<3"]

[project.optional-dependencies]
api = ["fastapi>=0.111,<1", "uvicorn>=0.30,<1"]
test = ["pytest>=8,<10", "httpx2>=0.1"]

[project.scripts]
respiratory-viral-multiplex-engine = "respiratory_viral_multiplex_agent.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/respiratory-viral-multiplex-agent"
Repository = "https://github.com/abusuraihsakhri/respiratory-viral-multiplex-agent"

[tool.setuptools.packages.find]
include = ["agents*", "respiratory_viral_multiplex_agent*"]
