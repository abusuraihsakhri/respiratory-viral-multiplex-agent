[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "respiratory-viral-multiplex-engine"
version = "2.0.0"
description = "RespViral Sentinel: Syndromic Multiplex PCR & Hospital Cohorting Engine"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
respiratory-viral-multiplex-engine = "respiratory_viral_multiplex_agent.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/respiratory-viral-multiplex-engine"
Repository = "https://github.com/abusuraihsakhri/respiratory-viral-multiplex-engine.git"
